<div style="font-family: system-ui, sans-serif, Arial; font-size: 14px; color: #212121;">
  <div style="max-width: 600px; margin: auto;">
    <div style="text-align: center; background-color: #13555a; padding: 32px 16px; border-radius: 32px 32px 0 0;">
      <a style="text-decoration: none; outline: none;" href="{{website_url}}" target="_blank" rel="noopener">
        <img style="height: 32px; vertical-align: middle;" src="{{website_url}}/assets/images/logo.png" alt="Sheba Homecare" height="32px" width="auto">
      </a>
    </div>
    <div style="padding: 24px;">
      <h1 style="font-size: 26px; margin-bottom: 8px; color: #13555a;">New contact form submission</h1>
      <p style="margin-bottom: 24px; color: #555;">Someone reached out via the Contact Us form on your website.</p>
      <table style="width: 100%; border-collapse: collapse;">
        <tr><td style="padding: 8px 0; border-bottom: 1px solid #eee;"><strong>Form</strong></td><td style="padding: 8px 0; border-bottom: 1px solid #eee;">{{dzToDo}}</td></tr>
        <tr><td style="padding: 8px 0; border-bottom: 1px solid #eee;"><strong>First name</strong></td><td style="padding: 8px 0; border-bottom: 1px solid #eee;">{{dzFirstName}}</td></tr>
        <tr><td style="padding: 8px 0; border-bottom: 1px solid #eee;"><strong>Last name</strong></td><td style="padding: 8px 0; border-bottom: 1px solid #eee;">{{dzLastName}}</td></tr>
        <tr><td style="padding: 8px 0; border-bottom: 1px solid #eee;"><strong>Email</strong></td><td style="padding: 8px 0; border-bottom: 1px solid #eee;"><a href="mailto:{{dzEmail}}">{{dzEmail}}</a></td></tr>
        <tr><td style="padding: 8px 0;"><strong>Phone</strong></td><td style="padding: 8px 0;"><a href="tel:{{dzPhoneNumber}}">{{dzPhoneNumber}}</a></td></tr>
      </table>
    </div>
    <div style="text-align: center; background-color: #13555a; padding: 16px; border-radius: 0 0 32px 32px; color: #ffffff;">
      <p style="margin: 0 0 8px 0;">Sheba Homecare</p>
      <p style="margin: 0 0 4px 0;">41 Brimblecom St, Lynn, MA 01902</p>
      <p style="margin: 0 0 4px 0;"><a style="color: #ffc002; text-decoration: none;" href="tel:+17812446847">+1 781-244-6847</a></p>
      <p style="margin: 0;"><a style="color: #ffc002; text-decoration: none;" href="mailto:info@shebahomecare.com">info@shebahomecare.com</a></p>
    </div>
  </div>
</div>
